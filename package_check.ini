# Findings of the Exponential extension package check (Setup > Extensions, the package wizard) that are examples,
# not secrets: the check leaves out exactly these. See doc/bc/6.0/extension-package-secret-check.md of Exponential 6.0.15.
[PackageCheck]
# the example secret word of the shipped settings, to be replaced by the merchant's own
AllowedFindings[]=settings/ezauthorize.ini.append.php:MD5HashSecretWord
